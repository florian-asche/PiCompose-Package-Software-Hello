name: Version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      level:
        description: Part of the version to raise for the pending commits (major, minor or patch), empty to use the labels
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    name: Version
    uses: florian-asche/PiCompose-Repository/.github/workflows/package-version.yml@v1.1.0
    with:
      level: ${{ inputs.level }}
    permissions:
      contents: write
      actions: write
      pull-requests: read
